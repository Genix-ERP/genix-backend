version: '3.8'

services:
  # GenixERP Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genix-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-genix}
      - DB_PASSWORD=${DB_PASSWORD:-genix_secret}
      - DB_NAME=${DB_NAME:-genixerp}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM_EMAIL=${EMAIL_FROM_EMAIL}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-GenixERP}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-eskiz}
      - SMS_API_EMAIL=${SMS_API_EMAIL:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_BASE_URL=${SMS_BASE_URL:-https://notify.eskiz.uz/api}
      - SMS_FROM=${SMS_FROM:-4546}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,https://my.yuksalish.group,http://my.yuksalish.group}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_PATH=/app/storage
      - MULTICARD_APPLICATION_ID=${MULTICARD_APPLICATION_ID:-}
      - MULTICARD_SECRET=${MULTICARD_SECRET:-}
      - MULTICARD_STORE_ID=${MULTICARD_STORE_ID:-0}
      - MULTICARD_BASE_URL=${MULTICARD_BASE_URL:-https://mesh.multicard.uz}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - PRICE_PER_USER_MONTHLY=${PRICE_PER_USER_MONTHLY:-199000}
      - PRICE_PER_USER_YEARLY=${PRICE_PER_USER_YEARLY:-169000}
      - CRM_API_BASE=${CRM_API_BASE:-}
      - CRM_USERNAME=${CRM_USERNAME:-}
      - CRM_PASSWORD=${CRM_PASSWORD:-}
    volumes:
      - genix_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - genix-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: genix-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-genix}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-genix_secret}
      - POSTGRES_DB=${DB_NAME:-genixerp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - genix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genix} -d ${DB_NAME:-genixerp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: genix-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - genix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Database Management UI (Development only)
  adminer:
    image: adminer:latest
    container_name: genix-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - genix-network
    profiles:
      - dev

  # Redis Commander - Redis Management UI (Development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: genix-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379${REDIS_PASSWORD:+:$REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - genix-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  genix_storage:
    driver: local

networks:
  genix-network:
    driver: bridge
  # NOTE: the `cross-stack` external network (shared with the Yuksalish CRM
  # stack) lives only on the yuksalish branch / Yuksalish server. The prod
  # Genix deployment (this main branch) has no CRM stack to reach, so it
  # must NOT declare cross-stack — otherwise `docker compose up` aborts on
  # the prod host with "network cross-stack declared as external, but could
  # not be found". Keep this divergence: do not add cross-stack back on main.
